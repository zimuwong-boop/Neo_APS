[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Django/DRF declarative Meta and generated migrations intentionally use class lists.
"catalog/models.py" = ["RUF012"]
"sales/models.py" = ["RUF012"]
"catalog/api.py" = ["RUF012"]
"sales/api.py" = ["RUF012"]
"**/migrations/*.py" = ["RUF012"]
"production/models.py" = ["RUF012"]
"production/api.py" = ["RUF012"]
